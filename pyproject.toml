[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "AugusLabDP"
version = "0.1.0"
description = "Dashboard software for Neuropixels data preprocessing"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "AugusLab"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# `pip install .` — dashboard app
dependencies = [
    "PyQt6",
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
]

[project.optional-dependencies]
# `pip install ".[utils]"` — analysis / notebook utilities
utils = [
    "seaborn",
    "scikit-learn",
    "pyqtgraph",
    "braian",
    "mne",
]
dev = [
    "pytest",
    "black",
    "flake8",
    "mypy",
]

[project.scripts]
auguslabdp = "app.__main__:main"

[tool.setuptools]
packages = ["app", "app.readutil", "AugusLabDP", "AugusLabDP.utils"]

[tool.setuptools.package-dir]
"app" = "AugusLabDP/app"
"AugusLabDP" = "AugusLabDP"

[tool.setuptools.package-data]
"AugusLabDP.utils" = ["region_info.csv"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
